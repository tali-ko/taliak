<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touch Snake</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: sans-serif;
  }
  canvas {
    display: block;
  }
  #score {
    position: fixed;
    top: 10px;
    left: 15px;
    font-size: 20px;
  }
</style>
</head>
<body>

<div id="score">Score: 0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

let snake = [{ x: canvas.width/2, y: canvas.height/2 }];
let snakeLength = 20;
let target = { x: canvas.width/2, y: canvas.height/2 };
let score = 0;

const FRUIT_COUNT = 5;
let fruits = [];

function spawnFruit() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: 10
  };
}

function initFruits() {
  fruits = [];
  for (let i = 0; i < FRUIT_COUNT; i++) {
    fruits.push(spawnFruit());
  }
}
initFruits();

// Mouse
canvas.addEventListener("mousemove", e => {
  target.x = e.clientX;
  target.y = e.clientY;
});

// Touch
canvas.addEventListener("touchmove", e => {
  const t = e.touches[0];
  target.x = t.clientX;
  target.y = t.clientY;
}, { passive: true });

function update() {
  const head = snake[0];
  const dx = target.x - head.x;
  const dy = target.y - head.y;
  const dist = Math.hypot(dx, dy);

  const speed = 4;
  if (dist > 1) {
    head.x += dx / dist * speed;
    head.y += dy / dist * speed;
  }

  snake.unshift({ x: head.x, y: head.y });
  while (snake.length > snakeLength) snake.pop();

  // fruit collisions
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    const d = Math.hypot(head.x - f.x, head.y - f.y);
    if (d < f.r + 8) {
      snakeLength += 8;
      score += 1;
      scoreEl.textContent = "Score: " + score;
      fruits[i] = spawnFruit();
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // fruits
  ctx.fillStyle = "red";
  for (const f of fruits) {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fill();
  }

  // snake
  for (let i = snake.length - 1; i >= 0; i--) {
    const p = snake[i];
    const t = i / snake.length;
    ctx.fillStyle = `hsl(${120 - t*60}, 70%, 50%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html><!DOCTYPE html>
