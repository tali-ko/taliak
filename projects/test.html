<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jumping Cat</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      margin: 0;
      font-family: sans-serif;
    }

    .cat {
      font-size: 100px;
      animation: jump 0.8s ease-in-out infinite;
    }

    @keyframes jump {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-150px);
      }
    }
  </style>
</head>
<body>
  <div class="cat">🐱</div>
</body>
</html>
