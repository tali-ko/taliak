<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Blockly Game</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

#blocksPanel {
  width: 35%;
  background: #f4f4f4;
  padding: 10px;
  overflow-y: auto;
  border-right: 2px solid black;
}

#workspace {
  min-height: 400px;
  border: 2px dashed #555;
  padding: 10px;
  background: white;
}

.block {
  background: #ffd966;
  border: 2px solid #333;
  border-radius: 10px;
  padding: 8px;
  margin: 5px 0;
  cursor: grab;
}

.block input {
  width: 60px;
}

.block select {
  margin-left: 5px;
}

#gamePanel {
  width: 65%;
  position: relative;
}

#grid {
  display: grid;
  grid-template-columns: repeat(10, 50px);
  grid-template-rows: repeat(10, 50px);
  gap: 2px;
  margin: 20px;
}

.cell {
  width: 50px;
  height: 50px;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

#car {
  width: 40px;
  height: 40px;
  background: red;
  position: absolute;
  transition: all 0.3s linear;
}

#score {
  font-size: 18px;
  margin: 10px;
}

#popup {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 30px 50px;
  font-size: 28px;
  border-radius: 15px;
  display: none;
  z-index: 10;
  text-align: center;
}

#stars {
  font-size: 22px;
  margin-left: 10px;
}

#rules {
  front-size: 21px;
  margin-left:10px;
}

#countdown {
  font-size: 20px;
  margin-top: 10px;
}

button {
  padding: 10px;
  margin-top: 10px;
  font-size: 16px;
}
</style>
</head>

<body>


  
<div id="blocksPanel">
  
    <span id="rules">move your car and collect all money to pass to the next level.</span>
  <h3>Blocks</h3>

  <div class="block" draggable="true" data-type="go">
    Go <input type="number" value="1" min="1" class="steps"> steps to the
    <select class="dir">
      <option>Right</option>
      <option>Left</option>
      <option>Down</option>
      <option>Up</option>
    </select>
  </div>

  <h3>Program</h3>
  <div id="workspace"></div>

  <button id="runBtn">Run</button>
  <button id="clearBtn">Clear</button>
</div>

<div id="gamePanel">
  <div id="score">Score: 0 | Level: 1 <span id="stars"></span>
  
  </div>
  <div id="grid"></div>
  <div id="car"></div>

  <div id="popup">
    <div>Congrats, You go to the next level 🎉</div>
    <div id="countdown">30</div>
  </div>

</div>

<script>
const workspace = document.getElementById("workspace");
const car = document.getElementById("car");
const grid = document.getElementById("grid");
const scoreDisplay = document.getElementById("score");

let carX = 0;
let carY = 0;
let score = 0;
let level = 1;
let money = [];
let startMoneyCount = 0;
let countdownInterval = null;

function createGrid() {
  grid.innerHTML = "";
  for (let i = 0; i < 100; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    grid.appendChild(cell);
  }
  grid.children[0].textContent = "Start";
  grid.children[90].textContent = "Finish";
}

function placeMoney() {
  money = [];
  const count = level + 2;
  startMoneyCount = count;

  while (money.length < count) {
    const pos = Math.floor(Math.random() * 90) + 1;
    if (!money.includes(pos)) {
      money.push(pos);
      grid.children[pos].textContent = "💰";
    }
  }
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

function updateCar() {
  car.style.left = (carX * 52 + 25) + "px";
  car.style.top = (carY * 52 + 25) + "px";
}

function updateScore() {
  const stars = document.getElementById("stars").textContent;
  scoreDisplay.innerHTML = `Score: ${score} | Level: ${level} <span id="stars">${stars}</span>`;
}

function makeDraggable(el) {
  el.setAttribute("draggable", "true");
  el.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", el.outerHTML);
  });
}

document.querySelectorAll(".block").forEach(makeDraggable);

workspace.addEventListener("dragover", e => e.preventDefault());
workspace.addEventListener("drop", e => {
  e.preventDefault();
  const html = e.dataTransfer.getData("text/plain");
  const div = document.createElement("div");
  div.innerHTML = html;
  const block = div.firstElementChild;
  if (!block) return;
  workspace.appendChild(block);
  makeDraggable(block);
});

function collectMoney() {
  const pos = carY * 10 + carX;
  const index = money.indexOf(pos);

  if (index !== -1) {
    money.splice(index, 1);
    grid.children[pos].textContent = "";
    score++;
    updateScore();
  }
}

function move(dir, steps) {
  for (let i = 0; i < steps; i++) {
    if (dir === "Right") carX++;
    if (dir === "Left") carX--;
    if (dir === "Down") carY++;
    if (dir === "Up") carY--;

    carX = clamp(carX, 0, 9);
    carY = clamp(carY, 0, 9);

    collectMoney();
  }

  updateCar();
}

function checkFinish() {
  if (carX === 0 && carY === 9 && money.length === 0) {
    showPopup();
  }
}

function runProgram() {
  carX = 0;
  carY = 0;
  updateCar();

  const blocks = Array.from(workspace.children);

  for (let block of blocks) {
    const type = block.dataset.type;

    if (type === "go") {
      const steps = parseInt(block.querySelector(".steps").value) || 0;
      const dir = block.querySelector(".dir").value;
      move(dir, steps);
    }

  }

  checkFinish();
}

function clearProgram() {
  workspace.innerHTML = "";
}

function startLevel() {
  createGrid();
  placeMoney();
  carX = 0;
  carY = 0;
  updateCar();
  updateScore();
}

function showPopup() {
  const popup = document.getElementById("popup");
  const countdownEl = document.getElementById("countdown");

  popup.style.display = "block";

  let stars = "★";
  if (startMoneyCount >= level + 1) stars = "★★";
  if (startMoneyCount >= level + 2) stars = "★★★";

  document.getElementById("stars").textContent = stars;
  updateScore();

  let timeLeft = 30;
  countdownEl.textContent = timeLeft;

  if (countdownInterval) clearInterval(countdownInterval);

  countdownInterval = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(countdownInterval);
      popup.style.display = "none";
      level++;
      clearProgram();
      startLevel();
    }

  }, 1000);
}

document.getElementById("runBtn").addEventListener("click", runProgram);
document.getElementById("clearBtn").addEventListener("click", clearProgram);

startLevel();
</script>

</body>
</html>
