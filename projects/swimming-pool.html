<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Catch The Hoops Game</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: skyblue;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    canvas {
        background: #87CEEB;
        display: block;
        margin: auto;
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;

// Player
const player = {
    x: canvas.width / 2,
    y: canvas.height - 120,
    width: 60,
    height: 100
};

// Hoop
let hoops = [];

function createHoop() {
    hoops.push({
        x: Math.random() * (canvas.width - 40),
        y: -40,
        radius: 20,
        speed: 4 + Math.random() * 2
    });
}

// Draw player (simple swimsuit figure)
function drawPlayer() {
    // Body
    ctx.fillStyle = "#FFDAB9";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Swimsuit
    ctx.fillStyle = "red";
    ctx.fillRect(player.x, player.y + 40, player.width, 40);

    // Head
    ctx.beginPath();
    ctx.arc(player.x + player.width/2, player.y - 20, 20, 0, Math.PI * 2);
    ctx.fill();
}

// Draw hoops
function drawHoops() {
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 5;

    hoops.forEach((hoop, index) => {
        ctx.beginPath();
        ctx.arc(hoop.x, hoop.y, hoop.radius, 0, Math.PI * 2);
        ctx.stroke();

        hoop.y += hoop.speed;

        // Collision detection
        if (
            hoop.y + hoop.radius > player.y &&
            hoop.x > player.x &&
            hoop.x < player.x + player.width
        ) {
            score++;
            hoops.splice(index, 1);
        }

        // Remove if off screen
        if (hoop.y > canvas.height) {
            hoops.splice(index, 1);
        }
    });
}

// Draw score
function drawScore() {
    ctx.fillStyle = "black";
    ctx.font = "30px Arial";
    ctx.fillText("Score: " + score, 20, 40);
}

// Game loop
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPlayer();
    drawHoops();
    drawScore();
    requestAnimationFrame(update);
}

// Touch + Mouse movement
function movePlayer(x) {
    player.x = x - player.width / 2;

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width)
        player.x = canvas.width - player.width;
}

canvas.addEventListener("mousemove", e => {
    movePlayer(e.clientX);
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    movePlayer(e.touches[0].clientX);
});

// Create hoops every second
setInterval(createHoop, 1000);

update();
</script>

</body>
</html>
