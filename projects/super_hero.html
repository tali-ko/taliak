
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Street Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            overflow: hidden;
            touch-action: none; /* Prevents default iOS zooming/scrolling */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #5c94fc;
        }
        canvas {
            background: #5c94fc;
            max-width: 100%;
            max-height: 70%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: block;
        }
        /* Mobile Touch Controls Overlay */
        #controlsOverlay {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none; /* Let canvas handle global raw events if needed, but buttons will override */
        }
        .d-pad, .action-buttons {
            display: flex;
            gap: 15px;
            pointer-events: auto; /* Enable touch on buttons */
        }
        .touch-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
        #scoreBoard {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="scoreBoard">
        <span id="scoreText">SCORE: 0</span>
        <span id="progressText">PROGRESS: 0%</span>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Touch Interface for iPhone / iPad -->
    <div id="controlsOverlay">
        <div class="d-pad">
            <div class="touch-btn" id="btnLeft">◀</div>
            <div class="touch-btn" id="btnRight">▶</div>
        </div>
        <div class="action-buttons">
            <div class="touch-btn" id="btnJump" style="width: 85px; height: 85px;">▲</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game state
let score = 0;
let gameOver = false;
let gameWon = false;
const gravity = 0.6;

// Camera/World offset
let cameraX = 0;
const worldWidth = 3000;

// Touch & Input State
const input = { left: false, right: false, jump: false };

// Bind Touch Events safely for iOS/iPadOS and Android
function bindButton(elementId, inputField) {
    const btn = document.getElementById(elementId);
   
    // Touch Start (Finger down)
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        input[inputField] = true;
    }, { passive: false });

    // Touch End (Finger lifted)
    btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        input[inputField] = false;
    }, { passive: false });

    // Handle finger sliding off the button unexpectedly
    btn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        input[inputField] = false;
    }, { passive: false });
}

bindButton('btnLeft', 'left');
bindButton('btnRight', 'right');
bindButton('btnJump', 'jump');

// Keep keyboard backup for desktop testing
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') input.right = true;
    if (e.key === 'ArrowLeft') input.left = true;
    if (e.key === ' ' || e.key === 'ArrowUp') input.jump = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowRight') input.right = false;
    if (e.key === 'ArrowLeft') input.left = false;
    if (e.key === ' ' || e.key === 'ArrowUp') input.jump = false;
});

// --- PLAYER OBJECT (Tal) ---
const player = {
    x: 100,
    y: 200,
    width: 32,
    height: 56,
    vx: 0,
    vy: 0,
    isGrounded: false,
    speed: 5.0, // Tweaked speed slightly for smoother touch performance
    jumpForce: 13,
    facing: 'right',
   
    draw: function() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);
       
        if (this.facing === 'left') {
            ctx.scale(-1, 1);
            ctx.translate(-this.width, 0);
        }

        // Jeans
        ctx.fillStyle = '#b0b7bd';
        ctx.fillRect(6, 36, 8, 14);
        ctx.fillRect(18, 36, 8, 14);

        // Shoes
        ctx.fillStyle = '#e65c00';
        ctx.fillRect(4, 50, 11, 6);
        ctx.fillRect(17, 50, 11, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(4, 54, 11, 2);
        ctx.fillRect(17, 54, 11, 2);

        // Blue Hoodie
        ctx.fillStyle = '#1e73be';
        ctx.fillRect(4, 16, 24, 22);
       
        // Shirt Striping
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(13, 16, 6, 12);
        ctx.fillStyle = '#ff6b6b';
        ctx.fillRect(13, 20, 6, 2);
        ctx.fillRect(13, 25, 6, 2);

        // Rocket Backpack
        ctx.fillStyle = '#34495e';
        ctx.fillRect(-2, 18, 7, 16);
        ctx.fillStyle = '#e65c00';
        ctx.fillRect(-2, 34, 4, 3);

        // Head
        ctx.fillStyle = '#f3d2b7';
        ctx.fillRect(6, 2, 20, 15);

        // Eyes
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(16, 5, 4, 4);
        ctx.fillStyle = '#5c3a21';
        ctx.fillRect(18, 6, 2, 2);

        // Ginger Hair & Bow
        ctx.fillStyle = '#ba3c13';
        ctx.fillRect(3, 4, 5, 14);
        ctx.fillRect(24, 4, 5, 14);
        ctx.fillRect(5, -2, 22, 6);
       
        ctx.fillStyle = '#9b59b6';
        ctx.fillRect(5, 3, 4, 4);

        ctx.restore();
    },
   
    update: function() {
        // Touch Input Parsing
        if (input.right) {
            this.vx = this.speed;
            this.facing = 'right';
        } else if (input.left) {
            this.vx = -this.speed;
            this.facing = 'left';
        } else {
            this.vx = 0;
        }

        if (input.jump && this.isGrounded) {
            this.vy = -this.jumpForce;
            this.isGrounded = false;
        }

        this.vy += gravity;
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = 0;
        if (this.x > worldWidth - this.width) this.x = worldWidth - this.width;

        const floorY = 330;
        if (this.y + this.height >= floorY) {
            this.y = floorY - this.height;
            this.vy = 0;
            this.isGrounded = true;
        }
    }
};

// --- GAME OBJECTS ---
const platforms = [
    {x: 300, y: 240, w: 120, h: 20},
    {x: 550, y: 180, w: 100, h: 20},
    {x: 800, y: 240, w: 150, h: 20},
    {x: 1200, y: 200, w: 200, h: 20},
    {x: 1600, y: 150, w: 120, h: 20},
    {x: 2000, y: 240, w: 180, h: 20},
    {x: 2400, y: 180, w: 150, h: 20}
];

const coins = [
    {x: 350, y: 200, collected: false},
    {x: 400, y: 200, collected: false},
    {x: 600, y: 140, collected: false},
    {x: 850, y: 190, collected: false},
    {x: 900, y: 190, collected: false},
    {x: 1250, y: 150, collected: false},
    {x: 1350, y: 150, collected: false},
    {x: 1650, y: 100, collected: false},
    {x: 2050, y: 190, collected: false},
    {x: 2120, y: 190, collected: false},
    {x: 2450, y: 130, collected: false},
    {x: 2500, y: 130, collected: false}
];

const enemies = [
    {x: 450, y: 305, w: 25, h: 25, vx: -1.5, basePlatform: null},
    {x: 850, y: 305, w: 25, h: 25, vx: -2, basePlatform: null},
    {x: 1250, y: 175, w: 25, h: 25, vx: -1, basePlatform: platforms[3]},
    {x: 1700, y: 305, w: 25, h: 25, vx: -2.5, basePlatform: null},
    {x: 2100, y: 305, w: 25, h: 25, vx: -1.5, basePlatform: null},
    {x: 2450, y: 155, w: 25, h: 25, vx: -1.2, basePlatform: platforms[6]}
];

const flagPoleX = 2800;

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.h &&
           rect1.y + rect1.height > rect2.y;
}

// Global screen resetting listener for simple touch restart loop
window.addEventListener('touchstart', () => {
    if (gameOver || gameWon) {
        document.location.reload();
    }
}, { passive: true });

function update() {
    if (gameOver || gameWon) return;

    player.update();

    cameraX = player.x - canvas.width / 3;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

    // Platform Collisions
    platforms.forEach(plat => {
        if (player.vx >= 0 && (player.x + player.width > plat.x && player.x < plat.x + plat.w)) {
            if (player.y + player.height <= plat.y && player.y + player.height + player.vy >= plat.y) {
                player.y = plat.y - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }
        }
    });

    // Coin Collection
    coins.forEach(coin => {
        if (!coin.collected) {
            let coinRect = { x: coin.x, y: coin.y, w: 20, h: 20, width: 20, height: 20 };
            if (checkCollision(player, coinRect)) {
                coin.collected = true;
                score += 100;
                document.getElementById('scoreText').innerText = `SCORE: ${score}`;
            }
        }
    });

    // Enemy Logic
    enemies.forEach(enemy => {
        enemy.x += enemy.vx;
        if (enemy.basePlatform) {
            if (enemy.x < enemy.basePlatform.x || enemy.x + enemy.w > enemy.basePlatform.x + enemy.basePlatform.w) {
                enemy.vx *= -1;
            }
        } else {
            if (enemy.x < 0 || enemy.x > worldWidth - enemy.w) {
                enemy.vx *= -1;
            }
        }

        let enemyRect = { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h, width: enemy.w, height: enemy.h };
        if (checkCollision(player, enemyRect)) {
            if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 10) {
                enemies.splice(enemies.indexOf(enemy), 1);
                player.vy = -8;
                score += 200;
                document.getElementById('scoreText').innerText = `SCORE: ${score}`;
            } else {
                gameOver = true;
            }
        }
    });

    // Progress
    let progress = Math.min(100, Math.floor((player.x / flagPoleX) * 100));
    document.getElementById('progressText').innerText = `PROGRESS: ${progress}%`;

    if (player.x + player.width >= flagPoleX) {
        gameWon = true;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Parallax Greens
    ctx.fillStyle = '#4da64d';
    for (let i = 0; i < worldWidth; i += 400) {
        ctx.beginPath();
        ctx.arc(i + 100 - cameraX, 330, 40, 0, Math.PI, true);
        ctx.fill();
    }

    // Platforms
    ctx.fillStyle = '#e57373';
    platforms.forEach(plat => {
        ctx.fillRect(plat.x - cameraX, plat.y, plat.w, plat.h);
        ctx.strokeStyle = '#7f0000';
        ctx.strokeRect(plat.x - cameraX, plat.y, plat.w, plat.h);
    });

    // Ground
    ctx.fillStyle = '#73cd4b';
    ctx.fillRect(0 - cameraX, 330, canvas.width + worldWidth, 15);
    ctx.fillStyle = '#cc7a00';
    ctx.fillRect(0 - cameraX, 345, canvas.width + worldWidth, 65);

    // Coins
    ctx.fillStyle = '#f1c40f';
    coins.forEach(coin => {
        if (!coin.collected) {
            ctx.beginPath();
            ctx.arc(coin.x + 10 - cameraX, coin.y + 10, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f39c12';
            ctx.font = 'bold 12px monospace';
            ctx.fillText("$", coin.x + 6 - cameraX, coin.y + 14);
        }
    });

    // Enemy Mushrooms
    enemies.forEach(enemy => {
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.arc(enemy.x + enemy.w/2 - cameraX, enemy.y + 12, 12, 0, Math.PI, true);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(enemy.x + 6 - cameraX, enemy.y + 4, 3, 3);
        ctx.fillRect(enemy.x + 16 - cameraX, enemy.y + 6, 3, 3);
        ctx.fillStyle = '#f5f5dc';
        ctx.fillRect(enemy.x + 7 - cameraX, enemy.y + 12, 11, 13);
    });

    // Flagpole
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(flagPoleX - cameraX, 100, 8, 230);
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.moveTo(flagPoleX - cameraX, 100);
    ctx.lineTo(flagPoleX - 40 - cameraX, 120);
    ctx.lineTo(flagPoleX - cameraX, 140);
    ctx.fill();

    player.draw();

    // Endgame Text States
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4d4d';
        ctx.font = 'bold 36px "Courier New"';
        ctx.fillText("GAME OVER", 300, 180);
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px "Courier New"';
        ctx.fillText("Tap anywhere to retry!", 285, 230);
    }

    if (gameWon) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 36px "Courier New"';
        ctx.fillText("YOU WIN!", 315, 180);
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px "Courier New"';
        ctx.fillText("Tap to play again!", 300, 230);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
